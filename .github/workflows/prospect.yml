name: Prospection quotidienne

on:
  schedule:
    - cron: "30 11 * * *"   # 11h30 UTC, avant la tâche de l'agent (12h00 UTC)
  workflow_dispatch:
    inputs:
      segment:
        description: "Segment (vide = rotation automatique)"
        required: false
        default: ""
      dry_run:
        description: "Simulation (n'envoie rien)"
        type: boolean
        default: false

jobs:
  prospect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer le prospecteur
        env:
          KIA_AGENT_URL: ${{ secrets.KIA_AGENT_URL }}
          KIA_API_TOKEN: ${{ secrets.KIA_API_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          SEGMENT: ${{ github.event.inputs.segment }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then python prospector.py --dry-run; else python prospector.py; fi
